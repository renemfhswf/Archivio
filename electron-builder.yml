appId: de.renemfhswf.archivio
productName: Archivio
copyright: Copyright © 2026 Rene
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  # Alle Abhängigkeiten sind in den Renderer gebündelt; der Hauptprozess
  # benötigt nur Electron und Node-Bordmittel. Das hält den Installer klein
  # und vermeidet lange Pfade beim Windows-Build.
  - '!node_modules/**/*'
asar: true
compression: maximum
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Archivio
  uninstallDisplayName: Archivio
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}
