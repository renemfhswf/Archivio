name: Windows-Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows-Installer bauen
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Tests ausführen
        run: npm test

      - name: Installer und portable Version bauen
        shell: bash
        run: |
          set -o pipefail
          npm run dist:win 2>&1 | tee build-windows.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Fehlerprotokoll veröffentlichen
        if: failure()
        shell: bash
        run: |
          {
            echo "## Windows-Build fehlgeschlagen"
            echo ""
            echo '```text'
            tail -n 300 build-windows.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: archivio-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: GitHub-Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Archivio ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: release/*.exe
